<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Rounded Container - Ivory & Zinc -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="#18181b" stroke="#27272a" stroke-width="2" filter="url(#subtleShadow)"/>
  
  <!-- Outer Context Meter Ring (Gauge) in Grayscale -->
  <path d="M 32 82 A 38 38 0 1 1 96 82" fill="none" stroke="#27272a" stroke-width="6" stroke-linecap="round"/>
  <path d="M 32 82 A 38 38 0 1 1 88 50" fill="none" stroke="#e4e4e7" stroke-width="6" stroke-linecap="round"/>

  <!-- Minimal Monochrome Layered Context Rectangles -->
  <rect x="42" y="44" width="44" height="28" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1.2"/>
  <rect x="46" y="52" width="36" height="28" rx="4" fill="#3f3f46" stroke="#52525b" stroke-width="1.2"/>
  <rect x="50" y="60" width="28" height="28" rx="4" fill="#faf9f5" stroke="#e4e4e7" stroke-width="1.2"/>

  <!-- Center Telemetry Spark in Dark Charcoal -->
  <path d="M 64 68 L 61 74 L 64 74 L 63 80 L 68 73 L 65 73 Z" fill="#18181b"/>
</svg>
